name: Compile & Test

permissions:
  actions: write
  contents: read

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Debug
  BUILDMASTER_DEBUG: 1
  # Windows only — pin Chocolatey NASM (avoid untested latest, e.g. 3.2.x AV in GHA)
  NASM_VERSION: "3.1.0"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang, clang-libc++]
        ffmpeg: [SYSTEM, BUNDLED]
        extra: [true, false]
        exclude:
          - compiler: clang-libc++
            ffmpeg: SYSTEM
          # SYSTEM packages don't exercise bundled nonfree/GPL codecs
          - ffmpeg: SYSTEM
            extra: true
    name: linux-${{ matrix.compiler }}-ffmpeg(${{ matrix.ffmpeg }})-extra(${{ matrix.extra }})
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/thirdparty/buildmaster/install/lib:${{ github.workspace }}/build/lib

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install FFmpeg system deps
        if: matrix.ffmpeg == 'SYSTEM'
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          cache-key: apt-ffmpeg-system-deps
          packages: 'ffmpeg libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev'

      - name: Install nasm/yasm (bundled FFmpeg)
        if: matrix.ffmpeg == 'BUNDLED'
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          cache-key: apt-nasm-yasm
          packages: 'nasm yasm'

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.compiler }}
          ccache-key: v1
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_ASAN=ON
            -DENABLE_TEST=ON
            -DWITH_FFMPEG=${{ matrix.ffmpeg }}
            -DWITH_NONFREE=${{ matrix.extra && 'ON' || 'OFF' }}
            -DWITH_GPL=${{ matrix.extra && 'ON' || 'OFF' }}
            -DWITH_STORMBYTE=BUNDLED
            ${{ matrix.compiler == 'clang-libc++' && '-DCMAKE_CXX_FLAGS=-stdlib=libc++' || '' }}
            ${{ matrix.compiler == 'clang-libc++' && '-DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++' || '' }}
            ${{ matrix.compiler == 'clang-libc++' && '-DCMAKE_SHARED_LINKER_FLAGS=-stdlib=libc++' || '' }}
            ${{ matrix.compiler == 'clang-libc++' && '-DCMAKE_MODULE_LINKER_FLAGS=-stdlib=libc++' || '' }}
          run-tests: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, clang-libc++, gcc]
        extra: [true, false]
    name: macos-${{ matrix.compiler }}-ffmpeg(BUNDLED)-extra(${{ matrix.extra }})
    env:
      DYLD_LIBRARY_PATH: ${{ github.workspace }}/build/thirdparty/buildmaster/install/lib:${{ github.workspace }}/build/lib

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install nasm/yasm (bundled FFmpeg)
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          cache-key: brew-nasm-yasm
          packages: 'nasm yasm'

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.compiler }}
          ccache-key: v1
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_ASAN=ON
            -DENABLE_TEST=ON
            -DWITH_FFMPEG=BUNDLED
            -DWITH_NONFREE=${{ matrix.extra && 'ON' || 'OFF' }}
            -DWITH_GPL=${{ matrix.extra && 'ON' || 'OFF' }}
            -DWITH_STORMBYTE=BUNDLED
            ${{ matrix.compiler == 'clang-libc++' && '-DCMAKE_CXX_FLAGS=-stdlib=libc++' || '' }}
            ${{ matrix.compiler == 'clang-libc++' && '-DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++' || '' }}
            ${{ matrix.compiler == 'clang-libc++' && '-DCMAKE_SHARED_LINKER_FLAGS=-stdlib=libc++' || '' }}
            ${{ matrix.compiler == 'clang-libc++' && '-DCMAKE_MODULE_LINKER_FLAGS=-stdlib=libc++' || '' }}
          run-tests: true
          ctest-options: --output-on-failure --test-dir ${{ github.workspace }}/build/test

  build-windows:
    runs-on: windows-latest
    name: windows-msvc

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install nasm ${{ env.NASM_VERSION }} and yasm
        shell: pwsh
        env:
          NASM_VERSION: ${{ env.NASM_VERSION }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:NASM_VERSION)) {
            Write-Error "NASM_VERSION is empty"
            exit 1
          }
          $nasmVer = $env:NASM_VERSION.Trim()
          Write-Host "Installing nasm $nasmVer (pinned) + yasm"
          choco install nasm --version=$nasmVer -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install yasm -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $candidates = @(
            "${env:ProgramFiles}\NASM",
            "${env:ProgramFiles(x86)}\NASM",
            "C:\ProgramData\chocolatey\bin"
          )
          $found = $false
          foreach ($d in $candidates) {
            $exe = Join-Path $d "nasm.exe"
            if (Test-Path $exe) {
              Write-Host "Found nasm in $d"
              Add-Content -Path $env:GITHUB_PATH -Value $d
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Error "nasm.exe not found after choco install"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value "C:\ProgramData\chocolatey\bin"

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: msvc
          ccache-key: v1
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_TEST=ON
            -DWITH_FFMPEG=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_NONFREE=ON
            -DWITH_GPL=ON
            "-DCMAKE_C_FLAGS=/W3 /wd4244 /wd4267 /wd4996 /wd4065 /D_CRT_SECURE_NO_WARNINGS /D_WIN32_WINNT=0x0A00"
            "-DCMAKE_CXX_FLAGS=/W3 /wd4244 /wd4267 /wd4996 /wd4065 /D_CRT_SECURE_NO_WARNINGS /D_WIN32_WINNT=0x0A00"
          run-tests: false

      - name: Add DLL directories to PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\build\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ github.workspace }}\build\thirdparty\buildmaster\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ github.workspace }}\build\thirdparty\buildmaster\install\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run unit tests
        shell: pwsh
        run: |
          ctest --output-on-failure --test-dir "${{ github.workspace }}\build\test"