name: CI

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  ###########################################################################
  # 0a. Warm submodule cache (one save per OS — Actions cache is OS-scoped)
  ###########################################################################
  checkout-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: checkout-bootstrap (${{ matrix.os }})
    steps:
      - name: Warm repository + submodule cache
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

  ###########################################################################
  # 0b. Warm APT lists only (Linux + docs)
  ###########################################################################
  apt-bootstrap:
    runs-on: ubuntu-latest
    name: apt-bootstrap
    steps:
      - name: Warm APT package indexes
        uses: stormbytepp/githubactions/.github/actions/update-apt-cached@master
        with:
          cache-key: apt-lists
          rotate-weekly: true

  ###########################################################################
  # LINUX
  ###########################################################################
  build-linux:
    needs: [checkout-bootstrap, apt-bootstrap]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang, clang-libc++]
        extra: [ON, OFF]
    name: linux-${{ matrix.compiler }}-extra(${{ matrix.extra }})
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/thirdparty/buildmaster/install/lib:${{ github.workspace }}/build/lib

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install nasm/yasm (bundled FFmpeg)
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: "nasm yasm"
          cache-key: apt-nasm-yasm
          lists-cache-key: apt-lists
          rotate-weekly: true

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.compiler }}
          ccache-key: v1-${{ matrix.compiler }}-extra-${{ matrix.extra }}
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_TEST=ON
            -DWITH_FFMPEG=BUNDLED
            -DWITH_NONFREE=${{ matrix.extra }}
            -DWITH_GPL=${{ matrix.extra }}
          run-tests: false

  ###########################################################################
  # macOS
  ###########################################################################
  build-macos:
    needs: [checkout-bootstrap]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang]
        extra: [ON, OFF]
    name: macos-${{ matrix.compiler }}-extra(${{ matrix.extra }})

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: ${{ matrix.compiler }}
          ccache-key: v1-${{ matrix.compiler }}-extra-${{ matrix.extra }}
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_TEST=ON
            -DWITH_FFMPEG=BUNDLED
            -DWITH_NONFREE=${{ matrix.extra }}
            -DWITH_GPL=${{ matrix.extra }}
          run-tests: false

  ###########################################################################
  # WINDOWS
  ###########################################################################
  build-windows:
    needs: [checkout-bootstrap]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [ON, OFF]
    name: windows-clang-cl-extra(${{ matrix.extra }})

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install nasm (bundled FFmpeg)
        uses: stormbytepp/githubactions/.github/actions/install-cached@master
        with:
          packages: nasm

      - name: Add DLL directories to PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\build\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ github.workspace }}\build\thirdparty\buildmaster\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          toolchain: clang-cl
          ccache-key: v1-clang-cl-extra-${{ matrix.extra }}
          build-type: ${{ env.BUILD_TYPE }}
          configure-options: >-
            -DENABLE_TEST=ON
            -DWITH_FFMPEG=BUNDLED
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_NONFREE=${{ matrix.extra }}
            -DWITH_GPL=${{ matrix.extra }}
            "-DCMAKE_C_FLAGS=/W3 /wd4244 /wd4267 /wd4996 /wd4065 /D_CRT_SECURE_NO_WARNINGS /D_WIN32_WINNT=0x0A00"
            "-DCMAKE_CXX_FLAGS=/W3 /wd4244 /wd4267 /wd4996 /wd4065 /D_CRT_SECURE_NO_WARNINGS /D_WIN32_WINNT=0x0A00"
          run-tests: false

  ###########################################################################
  # DOCS (master push / manual only)
  ###########################################################################
  docs:
    needs: [checkout-bootstrap, apt-bootstrap]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    uses: stormbytepp/githubactions/.github/workflows/generate-and-deploy-docs.yml@master
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    with:
      doc_target: StormByteMultimediaDoc
      extra-cmake-options: -DENABLE_DOC=ON -DWITH_STORMBYTE=BUNDLED -DWITH_FFMPEG=SYSTEM
      extra-install: "ffmpeg libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev"
      docs_output_dir: ./_site